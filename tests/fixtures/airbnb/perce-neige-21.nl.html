                            "content": {
                              "__typename": "UGCText",
                              "localizedStringWithTranslationPreference": "Het appartement bevindt zich op 20m van de skilift en op 100m van het centrum van het station. De supermarkt, winkels en apotheek bevinden zich op 200m via de korte gratis diagonale lift die het hoge en het lage gedeelte van het skistation met elkaar verbindt. Restaurants, bar, apres-ski bar en verhuurwinkels voor skimateriaal en fietsen bevinden zich in een straal van 100m rond het appartement.\nDe busstop voor Sion en de (in het winterseizoen) gratis shuttlebus voor Siviez is op 50m van het appartement.\n\nHaute-Nendaz (1400m hoogte) is een dorp dat het hele jaar door leeft. Makkelijk te bereiken met de auto of met het openbaar vervoer vanuit Sion (16km), Haute-Nendaz heeft een indrukwekkend uitzicht tot 46km op de rhonevallei bij helder weer.\n\nVanuit het appartement bent u op amper 20m van het skidomein 4Vallées (Nendaz, Verbier, La Tzoumaz, Veysonnaz en Thyon), het 2de grootste skidomein in Zwitserland met 412km pistes. \nVanop het hoogste punt (Mt Fort 3330m) heeft u bij helder weer een adembenemend uitzicht op de Mont Blanc en de Matterhorn tegelijk.\nIn de zomer kan u de skilift gebruiken om de zonsopgang mee te maken op 3300m hoogte of om sportive wandelingen te maken in de Alpen. De (al dan niet electrische) mountainbike kan ook mee boven voor tourtochten met of zonder gids.\n\nEr zijn ook tal van mogelijkheden om rustige wandelingen te maken langs de ‘Bisses’, een 98km lang netwerk van historische irrigatiekanalen.",
