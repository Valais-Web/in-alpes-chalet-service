"icon":"COMPACT_MAPS_LANDMARK","pinColorOverride":"#AC99F2","textFillColorOverride":"#A797DF","searchConfig":{"__typename":"SearchConfig","excludedPrimaryTypes":null,"excludedTypes":null,"includedPrimaryTypes":null,"includedTypes":["Tag:8213"]}}],"exactAddress":null,"verificationDetails":{"__typename":"StaysPdpLocationVerificationDetails","isVerified":false,"verifiedListingText":null,"verifiedHelpHtml":"L'adresse exacte sera communiquée après la réservation.","verifiedHelpLinkText":null,"verifiedHelpModalContent":null},"previewLocationDetails":[{"__typename":"StaysPdpLocationDetail","id":"neighborhood","displayType":"TEXT","title":"Points forts du quartier","content":{"__typename":"PdpUGCText","content":{"__typename":"UGCText","localizedStringWithTranslationPreference":"L'appartement est à 20m du départ du télécabine et à 100m du centre du station de ski. Les supermarchés, magasins et pharmacies sont à 200m par le court funiculaire gratuit qui relie le haut et le bas de la station. Restaurants, bars, après-ski et magasins de location de ski/vélo sont également à côté de l'appartement.\nL'arrêt du car postal (Sion-Nendaz) et de la navette gratuite pour Siviez (domaine skiable 4Vallées) est à 50m.\n\nHaute-Nendaz (1'400m) est une station de montagne qui vit toute l’année. Facilement accessible par la route (via la ville de Sion/autoroute à 16km de Nendaz) ainsi qu'en transports en commun (car postal depuis Sion/Sitten), Nendaz est un village ouvert sur la vallée du Rhône, avec beaucoup de dégagement et de vue sur les montagnes environnantes (Alpes bernoises notamment).\n\nDepuis l'appartement, vous êtes à seulement 20 mètres de 412km de pistes bleues, rouges et noires  (le 2ème plus grand domaine skiable en Suisse reliant Verbier, La Tzoumaz, Nendaz, Veysonnaz, Thyon). Vous pourrez monter jusqu'à 3'300m d'altitude au Mt-Fort pour un panorama à couper le souffle sur les Alpes suisses et françaises! \nEn été, vous pouvez aussi profiter des remontées mécaniques par exemp
